[package]
name = "schema-forge-mysql"
description = "The MySQL engine: versions, types, every kind of object, reading dumps and the live database, writing MySQL"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.schema-forge]
role = "engine"
database = "mysql"

[dependencies]
schema-forge-model = { path = "../../crates/model" }
schema-forge-engine = { path = "../../crates/engine" }
serde.workspace = true
serde_json.workspace = true
sqlparser.workspace = true
arrow-schema.workspace = true
# Pure Rust protocol and compression; TLS through rustls with ring (no system libraries).
mysql = { version = "28.0.4", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
