# The Rust workspace of the app (decision app-stack): one crate per job. tools/app/all.py builds, lints and tests it;
# CI runs that tool.
[workspace]
resolver = "3"
members = ["crates/store", "crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/k8nstantin/schema-forge"
publish = false

[workspace.dependencies]
schema-forge-store = { path = "crates/store" }
schema-forge-core = { path = "crates/core" }
anyhow = "1.0"
clap = { version = "4.6.10", features = ["derive"] }
deadpool-postgres = "0.14.2"
fastrand = "2.5.0"
futures-util = "0.3"
postgres-types = { version = "0.2", features = ["derive", "with-uuid-1"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1", "with-serde_json-1"] }
tokio-postgres-rustls = "0.14.0"
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# every public function's errors are its Result's error type, documented on that type, not repeated per function
missing_errors_doc = "allow"
# the crates are named schema_forge_*; their types need not avoid the module's name
module_name_repetitions = "allow"
unwrap_used = "warn"
