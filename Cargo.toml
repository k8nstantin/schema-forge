[workspace]
resolver = "3"
# crates/: what every database shares. engines/: one crate per database. tools/: checks of the code itself. Each folder
# joins the members with its first crate (cargo refuses a pattern that matches nothing).
# Every crate declares its role in `[package.metadata.schema-forge]`; tools/architecture fails the build when the
# roles depend on each other in a way docs/engines.md does not allow, or a database is named outside its engine.
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/k8nstantin/schema-forge"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
