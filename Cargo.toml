# The Rust workspace of the app (decision app-stack): one crate per job. tools/app/all.py builds, lints and tests it;
# CI runs that tool.
[workspace]
resolver = "3"
members = ["crates/store", "crates/core", "crates/engine", "crates/cli", "engines/mysql"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/k8nstantin/schema-forge"
publish = false

[workspace.dependencies]
schema-forge-store = { path = "crates/store" }
schema-forge-core = { path = "crates/core" }
schema-forge-engine = { path = "crates/engine" }
schema-forge-engine-mysql = { path = "engines/mysql" }
anyhow = "1.0"
# the Arrow types DataFusion 55 requires (^59.2.0); engines depend on arrow-schema alone, never on DataFusion
arrow-schema = "59.2.0"
async-trait = "0.1.92"
clap = { version = "4.6.10", features = ["derive"] }
deadpool-postgres = "0.14.2"
fastrand = "2.5.0"
futures-util = "0.3"
# TLS with rustls and ring, the store's own TLS stack
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls-ring"] }
postgres-types = { version = "0.2", features = ["derive", "with-uuid-1"] }
regex = "1.13.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1", "with-serde_json-1"] }
tokio-postgres-rustls = "0.14.0"
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
