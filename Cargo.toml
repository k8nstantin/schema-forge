[workspace]
resolver = "3"
# crates/: what every database shares. engines/: one crate per database. tools/: checks of the code itself. Each folder
# joins the members with its first crate (cargo refuses a pattern that matches nothing).
# Every crate declares its role in `[package.metadata.schema-forge]`; tools/architecture fails the build when the
# roles depend on each other in a way docs/engines.xml does not allow, or a database is named outside its engine.
members = ["crates/*", "engines/*", "tools/*"]
# engines/quill holds Quill's schema folder before its crate exists (specs/tasks/SF-95.xml builds it and removes this).
exclude = ["engines/quill"]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/k8nstantin/schema-forge"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
# The portable types every engine maps to: Apache Arrow's, the vocabulary DataFusion speaks. Kept to the Arrow version
# the DataFusion layer uses.
arrow-schema = "59.3.2"
# The SQL parser DataFusion is built on. Each SQL engine uses it directly, with its own dialect; engines share no SQL
# code with each other.
sqlparser = { version = "0.64.0", default-features = false, features = ["std", "visitor"] }
