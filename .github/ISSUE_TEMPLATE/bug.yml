name: Something is wrong
description: A page, a doc, the brief or the code does something it should not.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      placeholder: a page, a file, a command
