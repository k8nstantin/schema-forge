name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The one command (specs/rules.xml one-check), the same here as on every developer's machine. Each objective
      # adds its container proofs to it (decision branch-per-plugin).
      - run: tools/check.sh
