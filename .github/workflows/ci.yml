name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the toolchain rust-toolchain.toml pins: tools/check.py formats, lints and builds the app with it
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      # The one command (specs/rules.xml one-check), the same here as on every developer's machine.
      - run: python3 tools/check.py
      # the objectives' state in the spec, against the issues and pull requests on GitHub
      - run: python3 tools/objectives.py
        env:
          GH_TOKEN: ${{ github.token }}

  cortex:
    runs-on: ubuntu-latest
    steps:
      # the full history: tools/cortex/samples.py reads the old SchemaForge schema from it
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker pull -q postgres:18-alpine
      # the installer's test runs psql and pg_dump on the runner, as the DBA does on theirs: PostgreSQL 18's client
      - run: sudo apt-get install -y -q postgresql-common && sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y && sudo apt-get install -y -q postgresql-client-18
      # every proof of the cortex, each in fresh PostgreSQL 18 containers (the private MySQL sample is not here)
      - run: python3 tools/cortex/all.py

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the toolchain rust-toolchain.toml pins, with rustfmt and clippy
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: docker pull -q postgres:18-alpine
      # format, lint, licences and advisories, build; a store in a container; every test against it; schema-forge check
      - run: python3 tools/app/all.py
      # the speed (SF-156 gate speed): a generated schema of 2,608 objects on MySQL 8.0, imported in under 30 seconds and
      # written in under 5 on this runner; the server image is pulled by the tool
      - run: python3 tools/app/mysql.py --server mysql:8.0 --generated 2608 --import-limit 30 --write-limit 5

  engine-mysql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # each server image is pulled by the tool that first runs it;
      # engine_mysql plugged in; the round trip through the store on every server; the flavors (the old MySQL schemas
      # are private and not here)
      - run: python3 tools/mysql/all.py
