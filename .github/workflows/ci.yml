name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain comes from rust-toolchain.toml, the same here as on every developer's machine.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The one command: formatting, lint, every crate's tests with tools/architecture (the design in
      # docs/engines.md, checked on the code), and the canvas when it is there. The same command runs locally.
      - run: tools/check.sh
