name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain comes from rust-toolchain.toml, the same here as on every developer's machine.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # The one command (specs/rules.xml one-check): formatting, lint, every test, the architecture check and, once
      # built, the spec check among them. The same command runs locally.
      - run: tools/check.sh
