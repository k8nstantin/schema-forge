name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain comes from rust-toolchain.toml, the same here as on every developer's machine.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          # Loads written SQL into a real PostgreSQL 17 (Docker is on the runner).
          SCHEMA_FORGE_DOCKER: "1"

  canvas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canvas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: canvas/package-lock.json
      - run: npm ci
      # Type-checks with tsc, then bundles what the serve crate embeds.
      - run: npm run build
