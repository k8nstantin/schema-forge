[package]
name = "schema-forge"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "schema-forge"
path = "src/main.rs"

[dependencies]
schema-forge-core.workspace = true
schema-forge-dialects.workspace = true
schema-forge-store.workspace = true
schema-forge-serve.workspace = true
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
clap = { version = "4.6.9", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
