# cargo deny check: the licences the app may ship, known advisories, and where crates may come from (decision app-stack).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# exactly the licences the dependencies use, as cargo deny check reports them: a new licence fails the check until it
# is decided on, never let in by a guess
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
