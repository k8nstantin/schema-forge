# cargo deny check: the licences the app may ship, known advisories, and where crates may come from (decision app-stack).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# exactly the licences the dependencies use (tools/app/licences.py lists every crate's), decided by the owner on
# 2026-11-27: a new licence fails the check until it is decided on, never let in by a guess
allow = ["Apache-2.0", "MIT", "ISC", "BSD-3-Clause", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
